[project]
name = "tfimpact"
version = "0.1.0"
description = "Terraform change-impact recommendation learned from mined commit history (GA-weighted ranking)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-hcl2>=7.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "numpy>=2.0",
    "networkx>=3.3",
    "scipy>=1.14",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "requests>=2.32",
]

[project.optional-dependencies]
stretch = ["deap>=1.4", "lightgbm>=4.5"]
plots = ["matplotlib>=3.9"]

[project.scripts]
tfimpact = "tfimpact.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tfimpact"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option defaults are idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
