seed: 42

paths:
  terrads_db: data/external/terrads/TerraDS.sqlite
  repos_csv: data/raw/repos.csv
  shortlist_csv: data/raw/shortlist.csv
  dataset_csv: data/raw/dataset.csv     # output of `build-dataset`: the repos used downstream
  tmp: data/tmp
  processed: data/processed
  outputs: data/results                 # everything runs write: per-query tables, ga_runs/, full CSVs (gitignored)
  logs: data/logs                       # one timestamped log per select-repos / mine / build-dataset run
  models: models                        # trained model(s), committed (`tfimpact train`)
  results: results                      # curated, committed result tables + figures (`tfimpact export`)

selection:                      # every value is justified in docs/THRESHOLDS.md
  provider: aws                 # only place a provider is named
  min_resources: 20             # managed resources of `provider` in the repo (TerraDS)
  min_stars: 0
  shortlist: 150                # top-N by stars to depth-check; null = all of TerraDS (`--all`)
  min_tf_commits: 50            # cheap depth proxy (= min_usable_commits -> lossless)
  min_usable_commits: 50        # exact, applied by build-dataset after mining
  max_add_only_frac: 0.4        # exact, applied by build-dataset after mining
  dedup_forks: true             # repos sharing a root commit = one project (keep most stars)
  workers: 6                    # parallel blobless clones in the depth check
  exclude_keywords: []          # optional manual exclusions (unused by default)
  exclude_repos: []

clone:
  mode: blobless_prefetch       # blobless_prefetch | full
  timeout_s: 600
  prefetch_chunk: 2000          # blob oids per `git fetch` call

mining:
  max_commits: 2000
  min_items: 2
  max_items: 30
  warmup_frac: 0.2
  use_merge_commits: true       # first-parent merge = one PR-level transaction

features:
  max_candidates: 200
  prefilter_max_dist: 4          # pre-filter keeps blocks within this graph distance (= graph_max_dist)
  graph_max_dist: 4
  recency_tau: 100
  churn_window: 200

model:                          # columns of features.parquet the methods use
  features:                     # changing this never needs a re-mine
    - hist_cochange_conf
    - hist_cochange_count
    - hist_cochange_recency
    - hist_cand_recent_changes
    - hist_file_cochange_conf
    - hist_type_cochange_conf
    - graph_proximity
    - graph_shared_neighbors
    - graph_cand_degree
    - graph_propagation_conf
    - text_name_similarity
    - text_content_similarity
    # stored but off by default: loc_same_file, loc_same_dir

baselines:
  arm:                          # ROSE settings for shared parameters
    min_support: 1
    min_confidence: 0.1
    top_k: 10                   # open: may be raised if 10 proves too small after the dev check

ga:                             # settings justified in docs/THRESHOLDS.md
  population: 60
  generations: 60
  tournament: 3
  crossover_rate: 0.8
  blend_alpha: 0.5              # BLX-alpha crossover range extension
  mutation_rate: 0.3            # per gene
  sigma_start: 0.2              # Gaussian mutation sigma, linearly decaying
  sigma_end: 0.02
  elitism: 2
  fitness_sample: 5000          # training queries per run, equal number per repo
  offset_range: 1.0             # add-type offset gene in [-range, range]
  check_seeds: 1                # runs per fold for the sanity variants (permuted / negative)
  convergence_generations: 200  # generous budget for the convergence check
  convergence_seeds: 3
  convergence_tol: 0.001        # plateau = within this of the final training fitness
  valid_frac: 0.25              # inner validation share of training repos (convergence, tuning)
  tune: true                    # `ga` picks its configuration per fold by nested grid search
  grid:                         # 3 x 3 x 3 configurations, each with `seeds` runs
    pop_gen: [[30, 120], [60, 60], [120, 30]]   # population x generations, same budget
    mutation_rate: [0.1, 0.3, 0.5]
    crossover_rate: [0.6, 0.8, 0.95]
    seeds: 3

evaluation:
  k: [1, 3, 5, 10]              # 3 matches ROSE (top 3) and GA-IaCRec (Top@3)
  folds: 5                      # grouped by repository, balanced by query count
  seeds: 10                     # GA runs per fold
  bootstrap: 1000               # resamples for the 95% CI of per-repo means
  methods: [ga, random_search, arm, fixed_weights, random]

output:
  csv: true
  csv_features: false
